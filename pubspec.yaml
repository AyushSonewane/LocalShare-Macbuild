name: tcp_file_share
description: "A TCP-based LAN file sharing application built with Flutter."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  file_picker: ^8.3.7
  path_provider: ^2.1.5
  network_info_plus: ^6.0.1
  intl: ^0.19.0
  open_filex: ^4.6.0
  uuid: ^4.5.1
  shared_preferences: ^2.3.5
  permission_handler: ^11.4.0
  google_fonts: ^6.2.1
  receive_sharing_intent: ^1.8.1
  saver_gallery: ^4.0.0
  uri_content: ^3.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
