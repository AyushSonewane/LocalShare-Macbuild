name: tcp_file_share
description: "A TCP-based LAN file sharing application built with Flutter."
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  file_picker: ^8.3.7
  path_provider: ^2.1.5
  network_info_plus: ^6.0.1
  intl: ^0.19.0
  open_filex: ^4.6.0
  uuid: ^4.5.1
  shared_preferences: ^2.3.5
  permission_handler: ^11.4.0
  google_fonts: ^6.2.1
  saver_gallery: ^4.0.0
  uri_content: ^3.1.3
  lottie: ^3.1.2
  desktop_drop: ^0.4.4
  cross_file: ^0.3.4+2
  file_selector: ^1.1.0
  url_launcher: ^6.3.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  msix: ^3.16.7

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/

flutter_launcher_icons:
  # Source image — 1024x1024 PNG
  image_path: "assets/images/logo orange.png"
  android: true
  ios: false
  macos:
    generate: true
    image_path: "assets/images/logo orange.png"
  windows:
    generate: true
    image_path: "assets/images/logo orange.png"
    icon_size: 48

msix_config:
  display_name: LocalShare - Fast, and Secure File Sharing
  publisher_display_name: Ayush Sonewane
  identity_name: AyushSonewane.LocalShare-FastSecureFileSharing
  publisher: CN=3989E802-8F5D-4B59-9382-3A56414295A4
  msix_version: 1.0.1.0
  logo_path: assets\\images\\logo orange.png
  capabilities: "internetClient,privateNetworkClientServer"
  store: true
